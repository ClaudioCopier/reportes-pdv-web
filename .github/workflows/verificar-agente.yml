name: Verificar agente de la tienda

# Dispara api/verificar-agente.js -- la lógica de horario (10:30 a 21:00,
# hora de Santiago) y de no repetir el mismo aviso vive en la propia
# función, no acá.
#
# El cron automático (*/15 * * * *) se DESACTIVÓ el 2026-08-09: confirmado
# en producción que GitHub Actions retrasa/saltea los schedules de alta
# frecuencia (cada 15 min) -- corridas reales cada 2-3 horas en vez de cada
# 15 min, documentado así por GitHub para repos gratuitos con mucha carga
# en su infraestructura. El disparo real ahora lo hace cron-job.org
# (jobId 8239955, cuenta del usuario) pegándole al mismo endpoint. Este
# workflow queda solo para poder probarlo a mano (workflow_dispatch).
on:
  workflow_dispatch: {}

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar a /api/verificar-agente
        run: |
          curl -sf "https://reportes-pdv-web.vercel.app/api/verificar-agente?secret=${{ secrets.CRON_SECRET }}"
